{% extends "base.html" %}
{% block main_class %}container narrow{% endblock %}
{% block content %}
<section class="auth" aria-labelledby="login-title">
  <h1 id="login-title">Sign in</h1>
  {% if error %}<p class="alert alert-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field">
      <span>Email</span>
      <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus>
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary" type="submit" data-full>Sign in</button>
  </form>
</section>
{% endblock %}
