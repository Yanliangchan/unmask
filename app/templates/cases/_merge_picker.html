{% if candidates %}
<form class="merge-picker" hx-post="/cases/{{ case.id }}/entities/{{ entity.id }}/merge" hx-swap="none">
  <label class="small" for="merge-{{ entity.id }}-other">Merge <span class="ident">{{ entity.value }}</span> with</label>
  <select id="merge-{{ entity.id }}-other" name="other_id" required>
    {% for other, sim in candidates %}<option value="{{ other.id }}">{{ other.value }} ({{ sim | round | int }}% similar)</option>{% endfor %}
  </select>
  <button class="btn btn-primary btn-sm" type="submit">Merge</button>
  <button class="btn btn-ghost btn-sm" type="button" data-hide="#merge-row-{{ entity.id }}">Cancel</button>
  <span class="hint">You can split them again later.</span>
</form>
{% else %}
<div class="merge-picker">
  <span class="muted small">There's no other {{ entity.type | replace('_', ' ') }} in this case to merge with.</span>
  <button class="btn btn-ghost btn-sm" type="button" data-hide="#merge-row-{{ entity.id }}">Close</button>
</div>
{% endif %}
