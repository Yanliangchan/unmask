{% import "components/ui.html" as ui %}
<div class="graph-tab" data-graph="/cases/{{ case.id }}/graph.json" data-case="{{ case.id }}" data-case-name="{{ case.name }}">
  <div class="graph-toolbar" role="toolbar" aria-label="Graph filters">
    <label class="check"><input type="checkbox" data-graph-filter="confirmed"><span>Confirmed only</span></label>
    <label class="check"><input type="checkbox" data-graph-filter="pivot"><span>Found by pivots</span></label>
    <label class="check"><input type="checkbox" data-graph-filter="suggested" checked><span>Possible duplicates</span></label>
    <label class="check" title="Select a node to show only it and its direct links; select more nodes to expand"><input type="checkbox" data-graph-focus><span>Focus mode</span></label>
    <button class="btn btn-sm" type="button" data-graph-unfocus hidden>Show everything</button>
    <button class="btn btn-ghost btn-sm" type="button" data-graph-reset>Reset view</button>
    <button class="btn btn-ghost btn-sm" type="button" data-graph-png>{{ ui.icon("download") }}PNG</button>
    <span class="graph-stats" data-graph-stats aria-live="polite"></span>
  </div>
  <div class="graph-wrap">
    <div class="graph-canvas" id="cy" role="img" aria-label="Entities as nodes, sized by how connected they are and coloured and shaped by type, joined by their links. The Entities tab lists the same data."></div>
    <aside class="graph-panel" data-graph-panel hidden aria-label="Selected entity">
      <div class="graph-panel-head">
        <strong class="ident" data-graph-panel-title></strong>
        <button class="btn btn-ghost btn-sm btn-icon" type="button" data-graph-panel-close aria-label="Close">&times;</button>
      </div>
      <div id="graph-panel-body" class="graph-panel-body"></div>
    </aside>
  </div>
  <aside class="graph-legend" aria-label="Legend">
    <ul data-graph-legend role="list"></ul>
    <p>Bigger means more connected. Green ring: confirmed. Double ring: target. Dashed ring: found by a pivot. Dashed amber line: possible duplicate.</p>
  </aside>
  <noscript><p class="muted">The graph needs JavaScript. The Entities tab shows the same data.</p></noscript>
</div>
<script src="{{ static_url('js/graph.js') }}" data-cytoscape="{{ static_url('js/vendor/cytoscape.min.js') }}"></script>
